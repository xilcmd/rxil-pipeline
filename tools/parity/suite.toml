# Parity checks. A command may flip to native in crates/xil-cli/src/commands.rs
# only when every entry that exercises it passes.
#
# Each entry runs `xil <args>` in a fresh copy of fixtures/workspace under
# Python (XIL_FORCE_PY=all) and under Rust, then diffs everything.
#
#   name          unique label
#   args          argv after `xil`
#   mask_keys     JSON keys whose values are volatile (timestamps, hosts)
#   stdout_masks  regexes replaced with <MASK> in stdout before comparison
#   env           extra environment for both sides (e.g. a fake API key)
#
# Every check runs against tools/parity/mockapi.py: no request can reach a
# real API, and the requests each side made land in _api_requests.jsonl.

