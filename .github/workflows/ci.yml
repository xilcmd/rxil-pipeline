name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml pins the target dir to an ext4 path on the dev box
  # (drvfs is slow). Runners have no such path; the env var overrides it.
  CARGO_TARGET_DIR: target

jobs:
  # The one job that blocks a merge. Lint, unit tests, and the Python-vs-Rust
  # parity suite, all on Linux.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Strict rustdoc, the Rust-side twin of mkdocs `strict: true` in the
      # Python repo: a broken intra-doc link or bad HTML in a doc comment
      # fails the merge. Private items are documented too because every
      # crate here is internal to the binary; nothing is published yet.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items
      - name: Unit tests
        run: cargo nextest run --workspace
      - name: Build binary for parity
        run: cargo build --workspace
      # Man pages are generated from the clap definitions and committed; a
      # changed option without a regenerated page fails here.
      - name: Man pages are current
        run: |
          target/debug/xil --generate-man /tmp/man1
          diff -r man/man1 /tmp/man1
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: User guide builds
        run: mdbook build docs/book

      # Parity compares against the Python the port reproduces (a test-only
      # dependency; running xil never needs it). The reference is NOT the
      # PyPI release: xil-pipeline's main is many commits past the
      # 0.3.2 tag while still reporting "0.3.2", and those commits include
      # behaviour the port implements (the play_duration_pct pipe-hint, the
      # PHONE FILTER span). Pin the commit, not the version string, and
      # move it forward deliberately when the reference moves.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the reference Python pipeline
        env:
          XIL_PY_REF: e228100
        run: |
          python -m venv /tmp/xil-py
          /tmp/xil-py/bin/pip install --quiet \
            "xil-pipeline[tts-alt,publish] @ git+https://github.com/xilcmd/xil-pipeline@${XIL_PY_REF}" numpy
          /tmp/xil-py/bin/xil --version
      - name: Parity suite
        env:
          XIL_PY_BIN: /tmp/xil-py/bin/xil
          XIL_RS_BIN: ${{ github.workspace }}/target/debug/xil
          XIL_PARITY_SCRATCH: /tmp/parity-scratch
        run: /tmp/xil-py/bin/python tools/parity/parity.py check --suite

  # Informational only. A failure here must never cancel `check`, hence
  # fail-fast: false (see the Python repo's test.yml for the war story).
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo build --workspace
        # --no-fail-fast: nextest stops at the first failure by default, which
        # hides every later one and turns a cross-platform sweep into a
        # one-bug-per-CI-run drip.
      - run: cargo nextest run --workspace --no-fail-fast
