# Publish the mdBook user guide to GitHub Pages on every push to main.
# CI's `check` job already proves the book builds; this job builds it again
# on its own so a docs-only change never waits for the full test matrix.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one but never
# cancels a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs/book
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book
      - id: deployment
        uses: actions/deploy-pages@v4
