[workspace]
resolver = "2"
members = [
    "crates/xil-core",
    "crates/xil-audio",
    "crates/xil-api",
    "crates/xil-workers",
    "crates/xil-web",
    "crates/xil-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["John Brissette <xilcmd@gmail.com>"]
repository = "https://github.com/xilcmd/rxil-pipeline"
rust-version = "1.80"

# Pinned once here; crates reference them with `workspace = true`.
# Phase 0 only needs a handful. Later phases add to this list, never to a
# crate's own [dependencies] with a version.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
clap = { version = "4", features = ["derive", "env"] }
clap_mangen = "0.2"
regex = "1"
chrono = "0.4"
hostname = "0.4"
tempfile = "3"
sha2 = "0.10"
id3 = "1"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
filetime = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
shlex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
